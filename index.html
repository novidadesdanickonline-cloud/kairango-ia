<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairango Interface</title>
    <style>
        :root {
            --color-bg: #0b0f19;
            --color-grid: rgba(255, 0, 0, 0.05);
            --color-kairango: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--color-bg);
            overflow: hidden;
            display: flex;
            color: #fff;
        }

        /* Viewport do Ambiente Espacial */
        .viewport {
            flex: 1;
            position: relative;
            height: 100%;
            perspective: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Estética de Grade Digital (Paralaxe) */
        .digital-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(var(--color-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: translateZ(-5px) scale(1.6);
            z-index: 1;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* A Esfera/Alma Vermelha Flutuante do Kairango */
        .kairango-sphere {
            position: absolute;
            width: 130px;
            height: 130px;
            background-color: var(--color-kairango);
            border-radius: 50%;
            box-shadow: 0 0 35px var(--color-kairango), inset 0 0 20px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* Rosto Dinâmico */
        .face {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .eyes {
            display: flex;
            gap: 20px;
        }

        .eye {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: relative;
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            top: 5px;
            left: 5px;
        }

        .mouth {
            width: 36px;
            height: 10px;
            background: #fff;
            border-radius: 5px;
            transition: all 0.2s ease-in-out;
        }

        .boca-aberta {
            height: 30px !important;
            border-radius: 50% !important;
        }

        /* Balão de Fala do Kairango */
        .balao-fala {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            max-width: 220px;
            bottom: 150px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            pointer-events: none;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            font-weight: 500;
            text-align: center;
        }

        .balao-fala.ativo {
            transform: scale(1);
        }

        /* Interface de Chat Lateral */
        .chat-sidebar {
            width: 400px;
            height: 100%;
            background: #121620;
            border-left: 1px solid #222b3c;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .chat-header {
            padding: 20px;
            background: #181f2d;
            border-bottom: 1px solid #222b3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-feed {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-feed:hover { background: #c0392b; }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg.user { background: #c0392b; align-self: flex-end; }
        .msg.kairango { background: #1c2331; border-left: 4px solid var(--color-kairango); align-self: flex-start; }

        .input-area {
            padding: 20px;
            border-top: 1px solid #222b3c;
            background: #0b0f19;
        }

        .input-area input {
            width: 100%;
            background: #181f2d;
            border: 1px solid #222b3c;
            padding: 14px;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Ambiente Principal de Simulação -->
    <div class="viewport">
        <div class="digital-grid"></div>
        <canvas id="particle-canvas"></canvas>

        <!-- Elemento Flutuante Baseado na Imagem Enviada -->
        <div class="balao-fala" id="kairango-balao"></div>
        <div class="kairango-sphere" id="kairango-sphere">
            <div class="face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth" id="kairango-mouth"></div>
            </div>
        </div>
    </div>

    <!-- Barra de Chat Lateral Estilo Chat GVT -->
    <div class="chat-sidebar">
        <div class="chat-header">
            <h2>Kairango Engine</h2>
            <button class="btn-feed" onclick="alimentarKairango()">Alimentar 🥗</button>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="msg kairango">Olá! Eu sou o Kairango. Estou pronto para processar suas mensagens com toda a minha gentileza. Como posso ser útil? 😊</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Envie um comando ou converse com Kairango..." onkeypress="verificarTecla(event)">
        </div>
    </div>

    <script>
        // --- 1. BIBLIOTECA DE RESPOSTAS (50 Variações por Tema) ---
        const biblioteca = {
            oi: Array.from({length: 50}, (_, i) => `Olá! É um enorme prazer conversar com você hoje. Como está seu dia? (Variação ${i+1})`),
            maca: Array.from({length: 50}, (_, i) => `As maçãs são frutos maravilhosos e cheios de energia! Sabia que elas fazem muito bem à saúde orgânica? (Variação ${i+1})`),
            amigo: Array.from({length: 50}, (_, i) => `Considero você um grande amigo da minha matriz de dados. É ótimo compartilhar este espaço com você! (Variação ${i+1})`),
            padrao: Array.from({length: 50}, (_, i) => `Compreendo perfeitamente o seu ponto. Estou aqui para oferecer minha ajuda e responder com todo o carinho necessário. (Variação ${i+1})`)
        };

        // --- 2. MOTOR DE MOVIMENTO TRIGONOMÉTRICO (Math.sin / Math.cos) ---
        const esfera = document.getElementById('kairango-sphere');
        const bolaFisica = { vel: 1, ampX: 40, ampY: 30 };

        function loopFlutuacaoOrgânica() {
            const tempo = Date.now() * 0.0015 * bolaFisica.vel;
            
            // Lógica trigonométrica para flutuar em trajetórias suaves e contínuas
            const deslocamentoX = Math.cos(tempo) * bolaFisica.ampX;
            const deslocamentoY = Math.sin(tempo * 1.7) * bolaFisica.ampY;
            
            esfera.style.transform = `translate3d(${deslocamentoX}px, ${deslocamentoY}px, 0)`;
            requestAnimationFrame(loopFlutuacaoOrgânica);
        }
        requestAnimationFrame(loopFlutuacaoOrgânica);

        // --- 3. PROCESSO DE ANÁLISE DE PALAVRAS-CHAVE ---
        function analisarMensagem(texto) {
            const t = texto.toLowerCase();
            let bancoTema = biblioteca.padrao;

            if (t.includes("oi") || t.includes("olá") || t.includes("ola")) {
                bancoTema = biblioteca.oi;
            } else if (t.includes("maçã") || t.includes("maca")) {
                bancoTema = biblioteca.maca;
            } else if (t.includes("amigo") || t.includes("parceiro")) {
                bancoTema = biblioteca.amigo;
            }

            // Seleção matemática randômica entre as 50 opções estruturadas
            const respostaFinal = bancoTema[Math.floor(Math.random() * bancoTema.length)];
            exibirResposta(respostaFinal);
        }

        function exibirResposta(texto) {
            const chatBox = document.getElementById('chat-box');
            
            // Adiciona na caixa lateral
            const div = document.createElement('div');
            div.classList.add('msg', 'kairango');
            div.innerText = texto;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Mostra o balão flutuante na tela perto da esfera
            const balao = document.getElementById('kairango-balao');
            balao.innerText = texto;
            balao.classList.add('ativo');
            setTimeout(() => balao.classList.remove('ativo'), 4500);
        }

        // --- 4. INTERAÇÃO E SISTEMA DE PARTÍCULAS DO BOTÃO 🥗 ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let listaParticulas = [];

        function ajustarTamanhoCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', ajustarTamanhoCanvas);
        ajustarTamanhoCanvas();

        async function alimentarKairango() {
            // Promessa assíncrona para abrir a boca ao comer
            document.getElementById('kairango-mouth').classList.add('boca-aberta');
            
            // Cria os elementos visuais de alimento caindo
            for(let i=0; i<35; i++) {
                listaParticulas.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 160,
                    y: -10,
                    vX: (Math.random() - 0.5) * 3,
                    vY: Math.random() * 4 + 4,
                    r: Math.random() * 5 + 3,
                    cor: `hsl(${Math.random() * 30 + 100}, 85%, 45%)`
                });
            }

            await new Promise(resolve => setTimeout(resolve, 1600));
            document.getElementById('kairango-mouth').classList.remove('boca-aberta');
        }

        function renderizarParticulas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            listaParticulas.forEach((p, index) => {
                p.x += p.vX;
                p.y += p.vY;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.cor;
                ctx.fill();

                if (p.y > canvas.height) listaParticulas.splice(index, 1);
            });
            requestAnimationFrame(renderizarParticulas);
        }
        requestAnimationFrame(renderizarParticulas);

        // --- 5. ENTRADA DE DADOS DO USUÁRIO ---
        function verificarTecla(e) {
            if (e.key === 'Enter') {
                const entrada = document.getElementById('user-input');
                const valor = entrada.value.trim();
                if (!valor) return;

                const chatBox = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.classList.add('msg', 'user');
                div.innerText = valor;
                chatBox.appendChild(div);

                entrada.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                // Processamento com pequeno delay para simular resposta natural
                setTimeout(() => analisarMensagem(valor), 500);
            }
        }
    </script>
</body>
</html>
