<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRANGO IA</title>
    <style>
        body { background: black; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .alma { width: 90px; height: 90px; background: red; border-radius: 50%; box-shadow: 0 0 50px red; animation: float 3s ease-in-out infinite; margin-top: 30px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px); } }
        
        #chat { width: 90%; max-width: 400px; border: 1px solid #400; border-radius: 10px; padding: 15px; margin-top: 30px; background: #050000; box-shadow: 0 0 20px rgba(255,0,0,0.1); }
        #messages { height: 200px; overflow-y: auto; font-size: 14px; margin-bottom: 15px; }
        
        .k-msg { color: #ff3333; margin-bottom: 10px; } /* Vermelho Kairango */
        .u-msg { color: #33ff33; text-align: right; margin-bottom: 10px; } /* Verde Você */
        
        /* BARRA DE ENVIO COM BOTÃO */
        .input-bar { display: flex; gap: 5px; }
        input { flex: 1; background: #000; border: 1px solid #600; color: white; padding: 10px; border-radius: 5px; outline: none; font-family: 'Courier New', monospace; }
        button { background: #800; border: none; color: white; padding: 0 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:active { background: red; }
    </style>
</head>
<body>

    <div class="alma"></div>
    <h2 style="margin-top: 20px; letter-spacing: 5px;">🎪 KAIRANGO</h2>

    <div id="chat">
        <div id="messages">
            <div class="k-msg"><b>Kairango:</b> O circo está aberto! O que vamos criar hoje?</div>
        </div>
        <div class="input-bar">
            <input type="text" id="input" placeholder="Diga algo..." onkeypress="handleKey(event)">
            <button onclick="enviar()">➤</button>
        </div>
    </div>

    <script>
        async function enviar() {
            const box = document.getElementById('input');
            const msgDiv = document.getElementById('messages');
            const texto = box.value;
            if(!texto) return;

            msgDiv.innerHTML += `<div class="u-msg"><b>Você:</b> ${texto}</div>`;
            box.value = "";
            msgDiv.scrollTop = msgDiv.scrollHeight;

            try {
                // Link que conecta com a IA sem precisar de chave
                const res = await fetch(`https://allorigins.win{encodeURIComponent(`https://paxsenix.biz como Kairango, uma alma digital de círculo vermelho que ajuda na lição e cria aventuras: ${texto}`)}`);
                const data = await res.json();
                const final = JSON.parse(data.contents);
                
                const resposta = final.message || final.reply || "O sinal falhou... tente de novo!";
                msgDiv.innerHTML += `<div class="k-msg"><b>Kairango:</b> ${resposta}</div>`;
            } catch {
                msgDiv.innerHTML += `<div class="k-msg"><b>Kairango:</b> Erro na conexão digital!</div>`;
            }
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }

        function handleKey(e) { if (e.key === 'Enter') enviar(); }
    </script>
</body>
</html>
