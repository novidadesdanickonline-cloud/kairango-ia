<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairango IA</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
    color: white;
  }

  #chat {
    position: fixed;
    bottom: 80px;
    right: 10px;
    width: 92%;
    max-width: 360px;
    height: 420px;
    background: #141414;
    border-radius: 12px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 15px black;
  }

  #mensagens {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    font-size: 14px;
  }

  .input-area {
    display: flex;
    padding: 8px;
    background: #1c1c1c;
    align-items: center;
  }

  #input {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px;
    border-radius: 6px;
    background: #2a2a2a;
    color: white;
  }

  button {
    margin-left: 6px;
    border: none;
    background: red;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  #bola {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 55px;
    height: 55px;
    background: red;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 0 10px black;
    font-size: 22px;
  }

  img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 5px;
  }
</style>
</head>

<body>

<!-- 🧠 CHAT -->
<div id="chat">
  <div id="mensagens"></div>

  <div class="input-area">
    <input id="input" placeholder="Fale ou peça uma imagem...">

    <!-- 📷 enviar imagem -->
    <input type="file" id="file" accept="image/*" style="display:none" onchange="enviarImagem(event)">
    <button onclick="document.getElementById('file').click()">📷</button>

    <button onclick="responder()">></button>
  </div>
</div>

<!-- 🔴 BOLINHA -->
<div id="bola" onclick="toggleChat()">🧠</div>

<script>
let aberto = false;

function toggleChat() {
  let chat = document.getElementById("chat");
  aberto = !aberto;
  chat.style.display = aberto ? "flex" : "none";
}

function responder() {
  let input = document.getElementById("input");
  let texto = input.value.toLowerCase();
  let chat = document.getElementById("mensagens");

  if (texto === "") return;

  chat.innerHTML += "<div>🧑: " + texto + "</div>";

  // 🎨 gerar imagem
  if (texto.startsWith("imagem")) {
    let prompt = texto.replace("imagem", "").trim();

    let url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);

    chat.innerHTML += "<div>🔴 Aqui está sua imagem:<br><img src='" + url + "'></div>";

    input.value = "";
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  let respostas = [
    "Interessante...",
    "Estou processando isso...",
    "Continue falando.",
    "Hmm..."
  ];

  let resposta = respostas[Math.floor(Math.random() * respostas.length)];

  chat.innerHTML += "<div>🔴 " + resposta + "</div>";

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}

// 📷 enviar imagem do celular
function enviarImagem(event) {
  let file = event.target.files[0];
  let reader = new FileReader();
  let chat = document.getElementById("mensagens");

  reader.onload = function(e) {
    chat.innerHTML += "<div>🧑 enviou:<br><img src='" + e.target.result + "'></div>";
    chat.scrollTop = chat.scrollHeight;
  };

  if (file) {
    reader.readAsDataURL(file);
  }
}
</script>

</body>
</html>
