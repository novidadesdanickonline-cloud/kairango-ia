<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRANGO IA</title>
    <style>
        body { background: black; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .alma { width: 80px; height: 80px; background: red; border-radius: 50%; box-shadow: 0 0 40px red; animation: float 3s ease-in-out infinite; margin-top: 20px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        #chat { width: 90%; max-width: 400px; border: 2px solid #330000; border-radius: 10px; padding: 10px; margin-top: 20px; background: #050000; }
        #messages { height: 200px; overflow-y: auto; font-size: 14px; margin-bottom: 10px; padding-right: 5px; }
        .k-msg { color: #ff3333; margin-bottom: 10px; }
        .u-msg { color: #33ff33; text-align: right; margin-bottom: 10px; }
        input { width: 100%; background: #111; border: 1px solid red; color: white; padding: 10px; box-sizing: border-box; border-radius: 5px; outline: none; }
    </style>
</head>
<body>

    <div class="alma"></div>
    <h2 style="color: white; letter-spacing: 5px;">🎪 KAIRANGO</h2>

    <div id="chat">
        <div id="messages">
            <div class="k-msg"><b>Kairango:</b> O circo está aberto! O que vamos criar hoje?</div>
        </div>
        <input type="text" id="input" placeholder="Diga algo..." onkeypress="enviar(event)">
    </div>

    <script>
        async function enviar(e) {
            if (e.key === 'Enter') {
                const box = document.getElementById('input');
                const msgDiv = document.getElementById('messages');
                const texto = box.value;
                if(!texto) return;

                msgDiv.innerHTML += `<div class="u-msg"><b>Você:</b> ${texto}</div>`;
                box.value = "";
                msgDiv.scrollTop = msgDiv.scrollHeight;

                try {
                    // Usando um serviço de chat gratuito e direto
                    const res = await fetch(`https://allorigins.win{encodeURIComponent(`https://paxsenix.biz nome é Kairango, uma alma digital de círculo vermelho. Você ajuda com lição e aventuras Digital Circus. Responda: ${texto}`)}`);
                    const data = await res.json();
                    const final = JSON.parse(data.contents);
                    
                    msgDiv.innerHTML += `<div class="k-msg"><b>Kairango:</b> ${final.message || final.reply}</div>`;
                } catch {
                    msgDiv.innerHTML += `<div class="k-msg"><b>Kairango:</b> Soluço digital! Tente de novo.</div>`;
                }
                msgDiv.scrollTop = msgDiv.scrollHeight;
            }
        }
    </script>
</body>
</html>
