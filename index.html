<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: black; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .alma { width: 80px; height: 80px; background: red; border-radius: 50%; box-shadow: 0 0 30px red; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
        h1 { margin-top: 20px; color: white; }
    </style>
</head>
<body>
    <div class="alma"></div>
    <h1>🎪 KAIRANGO</h1>
    <p>O circo digital está em manutenção...</p>
</body>
</html>
