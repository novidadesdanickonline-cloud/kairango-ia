<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRANGO IA</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: black; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: sans-serif; }
        .alma { width: 100px; height: 100px; background: red; border-radius: 50%; box-shadow: 0 0 50px red; animation: float 3s ease-in-out infinite; margin-top: 50px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
        #chat-container { width: 90%; max-width: 500px; background: rgba(20, 20, 20, 0.9); border: 2px solid red; border-radius: 15px; padding: 15px; margin-top: 20px; box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); }
        #messages { height: 250px; overflow-y: auto; margin-bottom: 10px; font-size: 14px; }
        input { width: 100%; background: #111; border: 1px solid red; color: white; padding: 10px; border-radius: 5px; outline: none; }
        .msg-kairango { color: #ff5555; margin-bottom: 8px; }
        .msg-user { color: #55ff55; margin-bottom: 8px; text-align: right; }
    </style>
</head>
<body>

    <div class="alma"></div>
    <h1 class="text-2xl font-bold mt-4">🎪 KAIRANGO</h1>

    <div id="chat-container">
        <div id="messages">
            <div class="msg-kairango"><b>Kairango:</b> Olá! Sou sua alma digital. Pronto para uma aventura ou para a lição de casa?</div>
        </div>
        <input type="text" id="userInput" placeholder="Escreva aqui..." onkeypress="handleKeyPress(event)">
    </div>

    <script>
        async function handleKeyPress(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('userInput');
                const messages = document.getElementById('messages');
                const text = input.value;
                if(!text) return;

                messages.innerHTML += `<div class="msg-user"><b>Você:</b> ${text}</div>`;
                input.value = "";

                // Conexão com o cérebro da IA (Grátis e sem Token complexo para teste)
                try {
                    const response = await fetch("https://openrouter.ai", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            "model": "google/gemma-7b-it:free",
                            "messages": [{"role": "system", "content": "Seu nome é Kairango, uma alma de círculo vermelho que ajuda na lição e cria aventuras Digital Circus."}, {"role": "user", "content": text}]
                        })
                    });
                    const data = await response.json();
                    const reply = data.choices[0].message.content;
                    messages.innerHTML += `<div class="msg-kairango"><b>Kairango:</b> ${reply}</div>`;
                } catch {
                    messages.innerHTML += `<div class="msg-kairango"><b>Kairango:</b> O sinal do circo falhou! Tente de novo.</div>`;
                }
                messages.scrollTop = messages.scrollHeight;
            }
        }
    </script>
</body>
</html>
