<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRANGO IA</title>
    <style>
        body { background: black; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
        .alma { width: 80px; height: 80px; background: red; border-radius: 50%; box-shadow: 0 0 40px red; animation: float 3s ease-in-out infinite; margin-top: 20px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        #chat { width: 90%; max-width: 400px; border: 2px solid #500; border-radius: 10px; padding: 15px; margin-top: 20px; background: #050000; box-shadow: 0 0 15px rgba(255,0,0,0.2); }
        #messages { height: 220px; overflow-y: auto; font-size: 14px; margin-bottom: 15px; padding-right: 5px; }
        
        .k-msg { color: #ff3333; margin-bottom: 10px; }
        .u-msg { color: #33ff33; text-align: right; margin-bottom: 10px; }
        
        .input-bar { display: flex; gap: 8px; }
        input { flex: 1; background: #111; border: 1px solid red; color: white; padding: 12px; border-radius: 5px; outline: none; font-family: 'Courier New', monospace; }
        button { background: red; border: none; color: white; padding: 10px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 18px; }
        button:active { background: #b00; }
    </style>
</head>
<body>

    <div class="alma"></div>
    <h2 style="margin-top: 15px; letter-spacing: 5px; text-shadow: 0 0 10px red;">🎪 KAIRANGO</h2>

    <div id="chat">
        <div id="messages">
            <div class="k-msg"><b>Kairango:</b> O circo digital está online. O que vamos fazer hoje?</div>
        </div>
        <div class="input-bar">
            <input type="text" id="campo" placeholder="Diga algo...">
            <button onclick="enviar()">➤</button>
        </div>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('campo');
            const lista = document.getElementById('messages');
            const texto = input.value;
            
            if (!texto) return;

            // Mostra sua mensagem
            lista.innerHTML += `<div class="u-msg"><b>Você:</b> ${texto}</div>`;
            input.value = "";
            lista.scrollTop = lista.scrollHeight;

            try {
                // Tenta conectar com a alma digital
                const res = await fetch(`https://paxsenix.biz como Kairango, uma alma de círculo vermelho do Digital Circus que ajuda na lição: ${encodeURIComponent(texto)}`);
                const data = await res.json();
                
                const resposta = data.message || data.reply;
                
                if (!resposta) throw new Error(); // Força o erro se a resposta vier vazia

                lista.innerHTML += `<div class="k-msg"><b>Kairango:</b> ${resposta}</div>`;
            } catch (e) {
                // RESPOSTA FIXA QUE VOCÊ PEDIU (Caso a IA falhe)
                lista.innerHTML += `<div class="k-msg"><b>Kairango:</b> O sinal está instável, mas eu ainda estou aqui! Vamos continuar a aventura?</div>`;
            }
            lista.scrollTop = lista.scrollHeight;
        }

        // Faz o botão "Ir/Enter" do teclado do celular funcionar
        document.getElementById('campo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') enviar();
        });
    </script>
</body>
</html>
